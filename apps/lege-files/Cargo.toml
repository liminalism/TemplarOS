[package]
name = "lege-files"
description = "LegeOS standalone, service-backed file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "lege_files"
path = "src/lib.rs"

[[bin]]
name = "lege-files"
path = "src/main.rs"

[dependencies]
lege-client = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
# `StreamExt` for the `Files.Trash1.Changed` signal stream (src/backend.rs).
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
pixelkit-raster = { workspace = true }
pixelkit-text = { workspace = true }
pixelkit-ui = { workspace = true }
pixelkit-shell = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "lege-files"
section = "utils"
priority = "optional"
depends = "$auto, legeos-sessiond, legeos-filed, wl-clipboard"
assets = [
    ["target/release/lege-files", "usr/bin/lege-files", "755"],
    ["org.legeos.Files.desktop", "usr/share/applications/org.legeos.Files.desktop", "644"],
]
