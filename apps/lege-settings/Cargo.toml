[package]
name = "lege-settings"
description = "LegeOS Settings: typed settings schema, providers, background applications, associations, history and first-run conflicts in one place (skeleton)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lege-settings"
path = "src/main.rs"

[dependencies]
lege-client = { workspace = true }
lege-session-core = { workspace = true }
lege-types = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
pixelkit-raster = { workspace = true }
pixelkit-text = { workspace = true }
pixelkit-ui = { workspace = true }
pixelkit-shell = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-settings"
section = "x11"
priority = "optional"
depends = "$auto, legeos-sessiond"
assets = [
    ["target/release/lege-settings", "usr/bin/lege-settings", "755"],
    ["org.legeos.Settings.desktop", "usr/share/applications/org.legeos.Settings.desktop", "644"],
]
