[package]
name = "templar-files"
description = "TemplarOS standalone, service-backed file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "templar_files"
path = "src/lib.rs"

[[bin]]
name = "templar-files"
path = "src/main.rs"

[dependencies]
templar-client = { workspace = true }
templar-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
# `StreamExt` for the `Files.Trash1.Changed` signal stream (src/backend.rs).
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
pixelkit-raster = { workspace = true }
pixelkit-text = { workspace = true }
pixelkit-ui = { workspace = true }
pixelkit-shell = { workspace = true }
pixelkit-windowing = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "templar-files"
section = "utils"
priority = "optional"
depends = "$auto, templaros-sessiond, templaros-filed, wl-clipboard"
assets = [
    ["target/release/templar-files", "usr/bin/templar-files", "755"],
    ["org.templaros.Files.desktop", "usr/share/applications/org.templaros.Files.desktop", "644"],
]
