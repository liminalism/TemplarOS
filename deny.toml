# cargo-deny configuration (licences, advisories, duplicate/banned crates).
[graph]
all-features = false

[advisories]
ignore = []

[licenses]
# Own code is MPL-2.0 (ADR-0008). Dependencies must be permissive or weak-copyleft.
#
# GPL-3.0-only is allowed for exactly one crate: `lege-comp` (ADR-0012). The compositor is written
# against Smithay (MIT) but reads `cosmic-comp` (GPL-3.0-only) as an implementation reference for
# driver, XWayland and protocol quirks, so it carries that licence deliberately. MPL-2.0 combines
# into a GPL-3.0 work, so it may link the rest of the workspace unchanged; nothing links it back.
allow = [
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The compositor render thread must never block: lege-window must stay free of async runtimes and D-Bus.
# (Enforced structurally by `cargo xtask deps-check`; listed here for documentation.)
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
