[package]
name = "templar-session"
description = "TemplarOS session entry point: imports the environment into the user manager, starts templaros-session.target and waits for the compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "templar-session"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "templaros-session"
section = "x11"
priority = "optional"
depends = "$auto, systemd, templaros-sessiond, templaros-resourced, templaros-filed, templaros-comp, templaros-shell"
assets = [
    ["target/release/templar-session", "usr/bin/templar-session", "755"],
    ["../../session/units/wayland-sessions/templaros.desktop", "usr/share/wayland-sessions/templaros.desktop", "644"],
    ["../../session/units/user/templaros-session.target", "usr/lib/systemd/user/templaros-session.target", "644"],
    ["../../session/units/user/templar-shell.service", "usr/lib/systemd/user/templar-shell.service", "644"],
]
