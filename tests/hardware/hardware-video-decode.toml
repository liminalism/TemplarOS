# From X1's daily-driver matrix (C6). Blocked until D1 seeds `vainfo` and declares a media player;
# until then the automated `vaapi` probe answers only "which VA-API profiles exist", never "a video
# actually decoded on the GPU". Nothing here is executed by the runner.
id = "hardware-video-decode"
profiles = ["hybrid-intel-nvidia"]
steps = [
  "vainfo (also run automatically by lege doctor --hardware's vaapi probe)",
  "play a H.264 and a HEVC file in the declared media player, windowed and fullscreen",
  "watch the decode engine while it plays: intel_gpu_top for the iGPU, nvidia-smi -q -d UTILIZATION for the dGPU",
]
expect = [
  "vainfo lists VAProfileH264High and VAProfileHEVCMain from the Intel media driver",
  "playback is smooth at the panel's refresh rate with the CPU mostly idle",
  "the decode engine — not the CPU — shows the load, on whichever GPU is driving the session",
  "blocked while no media player is declared in the seeds: record as not executed, never as passed",
]
