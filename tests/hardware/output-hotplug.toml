id = "external-monitor-each-output-path"
profiles = ["hybrid-intel-nvidia"]
steps = ["boot without HDMI and record primary/feedback/Home plus dGPU runtime power", "connect Samsung HDMI (dGPU path), bounce cable, and exercise one late EDID probe", "record advertised 1080p60, 8-bit scanout and actual max-bpc readback where supported", "move a window between high-refresh panel and TV; exercise primary-output callback pacing and Home placement", "exercise external-only Home previews, then hide/lock Home and count new captures", "preview panel-off/HDMI-only, revert and expire; record presentation-before-break and final routing/timing", "exercise unsupported native import/fence and an isolated stalled owner in the recoverable lab seat", "switch active seat, lose bus name, and end compositor; reject stale acquisition/rearm", "interrupt secondary activation before presentation; restart user compositor and greeter", "disconnect/replug and measure actual owner cleanup and runtime suspend", "suspend/resume with qualified NVIDIA video-memory-preservation settings", "connect USB-C/DP (iGPU path) and repeat"]
