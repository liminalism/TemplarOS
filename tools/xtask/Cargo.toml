[package]
name = "xtask"
description = "Repository automation: tree-check, deps-check, check-interfaces, copyright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
templar-build = { workspace = true }
templar-file-index = { workspace = true, features = ["store"] }
templar-state = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
templar-client = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
