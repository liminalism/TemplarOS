[package]
name = "lege-comp"
description = "The compositor: Smithay directly (ADR-0012), driven entirely by lege-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The one crate in the workspace not under MPL-2.0 (ADR-0012, ADR-0008): Smithay is MIT, but this
# crate reads cosmic-comp (GPL-3.0-only) freely as an implementation reference for driver,
# XWayland and protocol quirks, so it carries that licence deliberately. `deny.toml` allows it.
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "lege-comp"
path = "src/main.rs"

[dependencies]
lege-window = { workspace = true }
lege-comp-integration = { workspace = true }
lege-types = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The compositor's own chrome renderer (`src/chrome/`): the recovery band/tab, the pressure
# overlay, the "show every window" labels, the fallback switcher and the lock screen are real
# painted pixels, not solid-colour placeholders. Both crates have no dependencies of their own
# (root `Cargo.toml`'s comment on `[workspace.dependencies]`), which is what makes them safe to
# link into the compositor's render thread.
pixelkit-raster = { workspace = true }
pixelkit-text = { workspace = true }

# Directly needed to compile the `wayland-scanner`-generated bindings for our two private
# protocols (src/protocols.rs). Version-unified by Cargo with whatever `smithay` pulls in
# transitively — kept at the same `0.31`/`0.32` lines deliberately so there is only ever one
# compiled `wayland-server`/`wayland-protocols`, and its types are the same types Smithay's own
# handler traits hand back (`ToplevelSurface`, `WlSurface`, ...).
#
# wayland-scanner 0.31 dropped the old build.rs-callable `generate_code` function in favour of
# `generate_interfaces!`/`generate_server_code!` proc-macros invoked directly from source — there
# is no build.rs entry point left to call at this pinned version, so bindings are generated in
# src/protocols.rs instead of a build script (see that file's module doc for why).
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["staging", "server"] }
wayland-scanner = "0.31"

# Pinned to the exact revision the workspace was validated against (compositor/COMPOSITOR.md,
# ADR-0012). `desktop` gives us `Space`/`Window`/`PopupManager` as a rendering/hit-test mirror —
# never a policy source; `lege_window::WindowService` stays the sole geometry/z-order authority
# (see src/space_sync.rs).
[dependencies.smithay]
git = "https://github.com/smithay/smithay.git"
rev = "1ed69cb"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "backend_egl",
    "backend_winit",
    "renderer_gl",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "backend_vulkan",
    "renderer_pixman",
    "renderer_multi",
    "xwayland",
    "x11rb_event_source",
]

# `smithay-drm-extras` supplies `DrmScanner` and EDID-based `display_info`, used by the udev
# backend for connector enumeration — same repo/rev as `smithay` itself.
[dependencies.smithay-drm-extras]
git = "https://github.com/smithay/smithay.git"
rev = "1ed69cb"

[dev-dependencies]
# `test-fonts` embeds two real Noto faces behind a feature specifically so downstream crates'
# tests get deterministic glyphs without depending on whatever fonts (if any) the host running
# `cargo test` happens to have installed — see `src/chrome/text.rs` tests. Cargo unifies features
# across dev/normal dependencies of the same crate, so this never reaches a non-test build.
pixelkit-text = { workspace = true, features = ["test-fonts"] }
tempfile = { workspace = true }
# A real Wayland client, used only by the connection test in src/backend/check.rs: it connects
# over the compositor's actual socket and reads the actual registry, so the test exercises the
# wire protocol rather than our own view of it.
wayland-client = "0.31"

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-comp"
section = "x11"
priority = "optional"
# libseat and the DRM/input/EGL stack are resolved by $auto from the linked libraries; xwayland is
# a runtime lookup rather than a link, so it has to be named.
depends = "$auto, xwayland"
assets = [
    ["target/release/lege-comp", "usr/bin/lege-comp", "755"],
    ["../../session/units/user/lege-comp.service", "usr/lib/systemd/user/lege-comp.service", "644"],
    ["../../interfaces/wayland/lege-shell-v1.xml", "usr/share/legeos/protocols/lege-shell-v1.xml", "644"],
    ["../../interfaces/wayland/lege-recovery-v1.xml", "usr/share/legeos/protocols/lege-recovery-v1.xml", "644"],
]
