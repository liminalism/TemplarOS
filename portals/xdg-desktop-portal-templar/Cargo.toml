[package]
name = "xdg-desktop-portal-templar"
description = "The single TemplarOS xdg-desktop-portal backend: FileChooser (filed), AppChooser (associations), Background (providers), Settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "xdg-desktop-portal-templar"
path = "src/main.rs"

[dependencies]
templar-build = { workspace = true }
templar-types = { workspace = true }
templar-client = { workspace = true }
templar-filed = { workspace = true }
templar-resourced = { workspace = true }
templar-session-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
url = { workspace = true }
pixelkit-raster = { workspace = true }
pixelkit-text = { workspace = true }
pixelkit-ui = { workspace = true }
pixelkit-shell = { workspace = true }
pixelkit-windowing = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "templaros-portal"
section = "x11"
priority = "optional"
depends = "$auto, xdg-desktop-portal, templaros-sessiond, templaros-filed"
assets = [
    ["target/release/xdg-desktop-portal-templar", "usr/libexec/xdg-desktop-portal-templar", "755"],
    ["templaros.portal", "usr/share/xdg-desktop-portal/portals/templaros.portal", "644"],
    ["templaros-portals.conf", "usr/share/xdg-desktop-portal/templaros-portals.conf", "644"],
    ["../../distro/policy/dbus/org.freedesktop.impl.portal.desktop.templaros.service", "usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.templaros.service", "644"],
    ["../../session/units/user/xdg-desktop-portal-templar.service", "usr/lib/systemd/user/xdg-desktop-portal-templar.service", "644"],
]
