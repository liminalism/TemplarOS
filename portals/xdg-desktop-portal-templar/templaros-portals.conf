# Portal backend selection for the TemplarOS session (XDG_CURRENT_DESKTOP=TemplarOS).
# Vendor defaults only: higher-precedence user portal configuration remains authoritative.
[preferred]
default=gtk
# Native PixelKit FileChooser is deferred; LXQt is the supported graphical picker.
org.freedesktop.impl.portal.FileChooser=lxqt;gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Settings=templaros;gtk
# Native interactive consent remains opt-in until its installed graphical gate passes.
org.freedesktop.impl.portal.Background=none
# No packaged capture backend with proven Templar compositor integration.
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Screenshot=none
