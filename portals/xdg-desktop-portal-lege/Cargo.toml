[package]
name = "xdg-desktop-portal-lege"
description = "The single LegeOS xdg-desktop-portal backend: FileChooser (filed), OpenURI (associations), Background (providers), Settings (skeleton)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xdg-desktop-portal-lege"
path = "src/main.rs"

[dependencies]
lege-types = { workspace = true }
lege-client = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-portal"
section = "x11"
priority = "optional"
depends = "$auto, xdg-desktop-portal, legeos-sessiond, legeos-filed"
assets = [
    ["target/release/xdg-desktop-portal-lege", "usr/libexec/xdg-desktop-portal-lege", "755"],
    ["legeos.portal", "usr/share/xdg-desktop-portal/portals/legeos.portal", "644"],
    ["legeos-portals.conf", "usr/share/xdg-desktop-portal/legeos-portals.conf", "644"],
]
