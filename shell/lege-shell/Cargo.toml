[package]
name = "lege-shell"
description = "LegeOS restartable shell: Home Surface drawers, panel/dock, launcher, window shelf, notification renderer (libcosmic-based; skeleton)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lege-shell"
path = "src/main.rs"

[dependencies]
lege-types = { workspace = true }
lege-client = { workspace = true }
lege-window = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-shell"
section = "x11"
priority = "optional"
depends = "$auto, legeos-sessiond"
assets = [["target/release/lege-shell", "usr/bin/lege-shell", "755"]]
