[package]
name = "lege-shell"
description = "LegeOS restartable shell: the Home Surface as a model over the services (drawers, dock grouping, pressure overlay text) plus a text renderer; no UI toolkit yet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lege_shell"
path = "src/lib.rs"

[[bin]]
name = "lege-shell"
path = "src/main.rs"

[dependencies]
lege-types = { workspace = true }
lege-client = { workspace = true }
lege-window = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-shell"
section = "x11"
priority = "optional"
depends = "$auto, legeos-sessiond"
assets = [["target/release/lege-shell", "usr/bin/lege-shell", "755"]]
