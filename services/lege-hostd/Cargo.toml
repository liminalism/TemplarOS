[package]
name = "lege-hostd"
description = "LegeOS privileged host daemon: staged kernel/driver update transactions, boot deployments and rollback, driver authority and GPU mode, storage reserve, hardware profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lege-hostd"
path = "src/main.rs"

[dependencies]
lege-build = { workspace = true }
lege-types = { workspace = true }
lege-hwdetect = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-hostd"
section = "admin"
priority = "optional"
depends = "$auto, systemd, apt, polkitd"
assets = [
    ["target/release/lege-hostd", "usr/libexec/lege-hostd", "755"],
    ["../../session/units/system/lege-hostd.service", "usr/lib/systemd/system/lege-hostd.service", "644"],
    ["../../distro/policy/polkit/org.legeos.host.policy", "usr/share/polkit-1/actions/org.legeos.host.policy", "644"],
    ["../../distro/policy/polkit/50-legeos-root-services.rules", "usr/share/polkit-1/rules.d/50-legeos-root-services.rules", "644"],
    ["../../distro/policy/dbus/org.legeos.Host.conf", "usr/share/dbus-1/system.d/org.legeos.Host.conf", "644"],
    ["../../distro/policy/apparmor/usr.libexec.lege-hostd", "etc/apparmor.d/usr.libexec.lege-hostd", "644"],
    ["../../distro/deploy/grub.d/09_legeos", "etc/grub.d/09_legeos", "755"],
]
