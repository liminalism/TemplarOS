[package]
name = "templar-sessiond"
description = "TemplarOS user session policy daemon: application identity & launching, associations, providers/autostart, history, notifications, settings, projects, power, location"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "templar-sessiond"
path = "src/main.rs"

[dependencies]
templar-build = { workspace = true }
templar-types = { workspace = true }
templar-appd = { workspace = true }
templar-associationd = { workspace = true }
templar-client = { workspace = true }
templar-session-core = { workspace = true }
templar-field = { workspace = true }
templar-state = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
sd-notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
zbus_systemd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "templaros-sessiond"
section = "admin"
priority = "optional"
depends = "$auto, systemd, xdg-utils"
assets = [
    ["target/release/templar-sessiond", "usr/libexec/templar-sessiond", "755"],
    ["../../session/units/user/templar-sessiond.service", "usr/lib/systemd/user/templar-sessiond.service", "644"],
    ["../../distro/app-manifests/*.json", "usr/share/templaros/apps/", "644"],
]
