[package]
name = "templar-resourced"
description = "TemplarOS desktop-aware resource governor: cgroup v2 + PSI pressure containment (separate, protected process)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "templar-resourced"
path = "src/main.rs"

[dependencies]
templar-build = { workspace = true }
templar-types = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "templaros-resourced"
section = "admin"
priority = "optional"
depends = "$auto, systemd"
assets = [
    ["target/release/templar-resourced", "usr/libexec/templar-resourced", "755"],
    ["../../session/units/user/templar-resourced.service", "usr/lib/systemd/user/templar-resourced.service", "644"],
]
