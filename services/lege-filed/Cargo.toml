[package]
name = "lege-filed"
description = "LegeOS file service: structured browsing, transactional operations, volumes, recents and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lege-filed"
path = "src/main.rs"

[dependencies]
lege-build = { workspace = true }
lege-types = { workspace = true }
lege-state = { workspace = true }
lege-file-index = { workspace = true }
anyhow = { workspace = true }
bpg-decode = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-filed"
section = "admin"
priority = "optional"
depends = "$auto, ffmpeg, systemd, udisks2"
assets = [
    ["target/release/lege-filed", "usr/libexec/lege-filed", "755"],
    ["../../target/preview-codecs/lege-preview-codecs", "usr/libexec/lege-preview-codecs", "755"],
    ["../../target/preview-codecs/licenses/JPXL-LICENSE-MIT", "usr/share/doc/legeos-filed/preview-codecs/JPXL-LICENSE-MIT", "644"],
    ["../../target/preview-codecs/licenses/LEGE-PDF-LICENSE", "usr/share/doc/legeos-filed/preview-codecs/LEGE-PDF-LICENSE", "644"],
    ["../../session/units/user/lege-filed.service", "usr/lib/systemd/user/lege-filed.service", "644"],
    ["../../interfaces/dbus/org.legeos.Files.Browse1.xml", "usr/share/dbus-1/interfaces/org.legeos.Files.Browse1.xml", "644"],
    ["../../interfaces/dbus/org.legeos.Files.Index1.xml", "usr/share/dbus-1/interfaces/org.legeos.Files.Index1.xml", "644"],
    ["../../interfaces/dbus/org.legeos.Files.Previews1.xml", "usr/share/dbus-1/interfaces/org.legeos.Files.Previews1.xml", "644"],
    ["../../interfaces/dbus/org.legeos.Files.Volumes1.xml", "usr/share/dbus-1/interfaces/org.legeos.Files.Volumes1.xml", "644"],
]
