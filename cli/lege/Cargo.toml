[package]
name = "lege"
description = "The LegeOS command line: one CLI over the OS services, including `lege doctor` — the single integration-check engine used at runtime, on images and on the hardware matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "lege"
path = "src/lib.rs"

[[bin]]
name = "lege"
path = "src/main.rs"

[dependencies]
lege-build = { workspace = true }
lege-types = { workspace = true }
lege-client = { workspace = true }
lege-hwdetect = { workspace = true }
lege-appd = { workspace = true }
lege-associationd = { workspace = true }
lege-filed = { workspace = true }
lege-resourced = { workspace = true }
lege-session-core = { workspace = true }
lege-state = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "legeos-cli"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/lege", "usr/bin/lege", "755"],
    # The component matrix travels with the tool that reads it.
    # cargo-deb resolves asset paths relative to this crate's directory.
    ["../../distro/deploy/components.toml", "usr/share/legeos/components.toml", "644"],
]
