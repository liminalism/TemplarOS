# TemplarOS workspace.
#
# Layout (see ARCHITECTURE.md):
#   crates/      pure library crates — the testable cores of every OS domain
#   services/    daemons (thin hosts over the crates)
#   session/     session entry + systemd user units
#   compositor/  templar-comp (the Smithay compositor) + templar-comp-integration
#   shell/ apps/ portals/ cli/  user-facing binaries
#   tools/xtask  repository automation
[workspace]
resolver = "3"
members = [
    "crates/templar-types",
    "crates/templar-ui",
    "crates/templar-display-ui",
    "crates/templar-appd",
    "crates/templar-build",
    "crates/templar-associationd",
    "crates/templar-window",
    "crates/templar-field",
    "crates/templar-treemap",
    "crates/templar-session-core",
    "crates/templar-state",
    "crates/templar-client",
    "crates/templar-hwdetect",
    "crates/templar-file-index",
    "crates/templar-fanotify",
    "crates/templar-clipboard",
    "crates/templar-archive",
    "crates/templar-wallpaper",
    "crates/templar-effects",
    "services/templar-sessiond",
    "services/templar-resourced",
    "services/templar-filed",
    "services/templar-hostd",
    "services/templar-boot-health",
    "session/templar-session",
    "compositor/templar-comp-integration",
    "compositor/templar-comp",
    "shell/templar-shell",
    "apps/templar-settings",
    "apps/templar-greeter",
    "apps/templar-displays",
    "apps/templar-files",
    "portals/xdg-desktop-portal-templar",
    "cli/templar",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The preview/codecs graph requires Rust 1.97, so the workspace shares that honest floor
# instead of advertising an archive baseline its resolved dependencies cannot build (ADR-0008).
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/templaros/templaros"
homepage = "https://templaros.org"
authors = ["TemplarOS contributors"]

[workspace.dependencies]
# internal
templar-types = { path = "crates/templar-types" }
templar-ui = { path = "crates/templar-ui" }
templar-display-ui = { path = "crates/templar-display-ui" }
templar-appd = { path = "crates/templar-appd" }
templar-build = { path = "crates/templar-build" }
templar-associationd = { path = "crates/templar-associationd" }
templar-window = { path = "crates/templar-window" }
templar-field = { path = "crates/templar-field" }
templar-treemap = { path = "crates/templar-treemap" }
templar-session-core = { path = "crates/templar-session-core" }
templar-state = { path = "crates/templar-state" }
templar-client = { path = "crates/templar-client" }
templar-hwdetect = { path = "crates/templar-hwdetect" }
templar-file-index = { path = "crates/templar-file-index", default-features = false }
templar-fanotify = { path = "crates/templar-fanotify" }
templar-archive = { path = "crates/templar-archive" }
templar-wallpaper = { path = "crates/templar-wallpaper", default-features = false }
templar-effects = { path = "crates/templar-effects" }
templar-comp-integration = { path = "compositor/templar-comp-integration" }
templar-resourced = { path = "services/templar-resourced" }
templar-filed = { path = "services/templar-filed" }
templar = { path = "cli/templar" }

# external
anyhow = "1"
async-trait = "0.1"
bpg-decode = { package = "still265", path = "../bpg-rs/crates/still265", features = ["rayon"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libc = "0.2"
parking_lot = "0.12"
# Dev-tool only (`cargo xtask check-interface-signatures`): no service links it.
quick-xml = "0.41"
# First-party toolkit adapters. Raster/text/shell/ui are window-host independent; only
# pixelkit-windowing links winit/softbuffer. The compositor may use pure UI primitives without
# pulling a second event loop or host window backend into its render thread.
#
# Owner-supplied paths retain their real source layout. Production/source-package
# preparation closes exact content and both locked graphs with the existing local
# source archive tool (see CONTRIBUTING.md); no public origin/pin is invented.
pixelkit-raster = { path = "../pixelkit/crates/pixelkit-raster" }
pixelkit-text = { path = "../pixelkit/crates/pixelkit-text" }
pixelkit-ui = { path = "../pixelkit/crates/pixelkit-ui" }
pixelkit-shell = { path = "../pixelkit/crates/pixelkit-shell" }
pixelkit-windowing = { path = "../pixelkit/crates/pixelkit-windowing" }
proptest = "1"
png = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
zbus_systemd = { version = "0.26000", default-features = false, features = ["systemd1", "timedate1", "zbus-async-tokio"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
unused_async = "allow"
duration_suboptimal_units = "allow"
implicit_hasher = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.debug-release]
inherits = "release"
lto = false
codegen-units = 16

[profile.release-final]
inherits = "release"
lto = "thin"
