# The LegeOS component matrix — what a build set is made of, and what it takes to make each
# part of it actually run.
#
# This file is data, not code, because four different things needed the same list and each had
# grown its own copy: the justfile's `deb` recipe, `lege doctor`'s LEGEOS_PACKAGES, the reinstall
# script's expected_packages, and the deployment tooling. `cargo xtask check-packaging` checks it
# against debian/control and the workspace, so a package added in one place and forgotten here
# fails the build rather than quietly dropping out of a deployment.
#
# Installed to /usr/share/legeos/components.toml; `lege dev` reads the repository copy when run
# from a checkout and the installed one otherwise.
#
# activation — what has to happen before a newly installed component is the one running:
#   immediate      nothing: the next invocation is the new binary (CLIs, data-only packages).
#   restart        restart its unit; the deployment then waits for it to come back healthy.
#   relaunch       running instances keep the old binary; the next launch gets the new one.
#   manual         restartable in principle, but not by the tool yet — it prints what to do.
#   needs-session  requires logging out and back in (the compositor and the session units).
#   needs-reboot   requires a reboot (boot-path components).
#
# `manual` is where the honesty lives. Restarting sessiond, filed or the portal disconnects
# every proxy the shell holds; those rows stay manual until the composed-session restart test
# exists (roadmap track B4). Shipping them as `restart` today would make the tool confidently
# break a live desktop.
#
# The service audit's fields (@legeos.decision.event-driven-service-authorities: "each persistent
# daemon and polling exception records its authority, lifetime, activation, recovery, deadline
# and justification"). `cargo run -q -p xtask -- check-packaging` fails when a component with a
# unit leaves one blank, and `cargo run -q -p xtask -- components --field timer_exceptions`
# renders them.
#
# authority     — the state domain this component is the single authoritative owner of.
# lifetime      — dbus-activated | session-bound | oneshot. `Type=dbus` describes readiness, not
#                 activation. A dbus-activated unit must also ship a D-Bus activation descriptor;
#                 a session-bound authority may use `Type=dbus` while continuously owning state.
# consumer_interfaces — the typed boundary consumers read that state through. Never the private
#                 store: a consumer that opens the owner's SQLite is the thing the decision
#                 forbids.
# recovery      — what a consumer does when continuity is lost, and what the component does on
#                 restart.
# deadlines     — the bounded response times it commits to.
# timer_exceptions — every timer or blocking sleep left in it, with the reason an event cannot
#                 replace it. Timers are allowed for temporal conditions, backoff, bounded active
#                 episodes and reconciliation; an unlisted wait is a bug. Test-only sleeps are
#                 not listed — they are not in the shipped path.

version = 1

[[component]]
name = "sessiond"
crate = "lege-sessiond"
package = "legeos-sessiond"
stamp = "lege-sessiond"
unit = "lege-sessiond.service"
scope = "user"
activation = "manual"
depends_on = []
summary = "session policy daemon — identity, launching, associations, history, settings"
authority = "session policy: identity, launching, associations, providers, history, notifications, settings, projects, power, location — one state database, one crash unit (ADR-0001)"
lifetime = "session-bound"
consumer_interfaces = [
    "org.legeos.AppIdentity1", "org.legeos.Launcher1", "org.legeos.Associations1",
    "org.legeos.Providers1", "org.legeos.History1", "org.legeos.Notifications1",
    "org.legeos.Settings1", "org.legeos.Projects1", "org.legeos.Lifecycle1",
]
recovery = "clients reconnect to the bus name and re-read; every interface answers a full current state, so there is no history to replay and nothing to resnapshot"
deadlines = "a launch is acknowledged before the process is spawned; a settings write is durable before it returns"
timer_exceptions = [
    { site = "main.rs:644", interval = "500ms x30", reason = "backoff waiting for the compositor's Wayland socket to accept a connection; there is no event for a socket that does not exist yet, and the loop gives up after 15s rather than waiting forever" },
    { site = "main.rs:663", interval = "WatchdogSec/2", reason = "the service manager's watchdog ping is a timer by definition — systemd kills the unit if it stops arriving" },
    { site = "apis/notifications.rs:128", interval = "until expires_ms", reason = "a notification's expiry is a temporal condition: the thing being waited for is the passage of time itself" },
    { site = "background/crash_ingest.rs:162", interval = "configured", reason = "reconciliation against systemd-coredump's journal, which offers no subscription; bounded and idempotent" },
    { site = "background/notification_provider.rs:78", interval = "configured", reason = "reconciles which provider should hold org.freedesktop.Notifications; a settings change has no signal a background task can await today" },
]


[[component]]
name = "resourced"
crate = "lege-resourced"
package = "legeos-resourced"
stamp = "lege-resourced"
unit = "lege-resourced.service"
scope = "user"
activation = "restart"
depends_on = []
summary = "resource governor"
authority = "memory pressure policy: which instance is reclaimed, and what protection every session-critical unit keeps"
lifetime = "session-bound"
consumer_interfaces = ["org.legeos.Resources1"]
recovery = "stateless across restarts by design (ADR-0002): the governor re-reads cgroups and PSI on its first tick and owes no consumer any history"
deadlines = "a pressure trigger is acted on within one tick; the loop touches no SQLite, no fsync and no D-Bus (ADR-0002)"
timer_exceptions = [
    { site = "daemon.rs:580", interval = "60s idle heartbeat, `interval` under pressure", reason = "a bounded active episode: PSI triggers the wakeup, and the sampling interval applies only while pressure is being tracked. The idle heartbeat re-reads cgroup membership, which has no event." },
]


[[component]]
name = "filed"
crate = "lege-filed"
package = "legeos-filed"
stamp = "lege-filed"
unit = "lege-filed.service"
scope = "user"
activation = "manual"
depends_on = []
summary = "file service"
authority = "the per-user file index and every filesystem watch in the session; transactional file operations and their journals"
lifetime = "session-bound"
consumer_interfaces = [
    "org.legeos.Files.Index1", "org.legeos.Files.Browse1", "org.legeos.Files.Search1",
    "org.legeos.Files.Volumes1", "org.legeos.Files.Previews1",
]
recovery = "generation identifies a committed view and a sequence identifies change-log position; ChangesSince(seq) below the retained floor answers SnapshotRequired and the consumer resnapshots through OpenSnapshot. Consumers never open the SQLite store."
deadlines = "a query is answered from the last committed generation without waiting for a scan; no client start triggers a synchronous walk"
timer_exceptions = [
    { site = "preview.rs:501", interval = "10ms", reason = "reaping a bounded preview child against its own deadline; the wait ends when the process does, and the poll only exists because the deadline has to be enforced against a child that hangs" },
]


[[component]]
name = "hostd"
crate = "lege-hostd"
package = "legeos-hostd"
stamp = "lege-hostd"
unit = "lege-hostd.service"
scope = "system"
activation = "restart"
depends_on = []
summary = "privileged system-bus surface"
authority = "the privileged system surface (ADR-0003): updates, deployments, driver authorisation, storage reserve, hardware profile, boot entries and index checkpoints"
lifetime = "dbus-activated"
consumer_interfaces = [
    "org.legeos.Host.Updates1", "org.legeos.Host.Deployments1", "org.legeos.Host.Drivers1",
    "org.legeos.Host.Storage1", "org.legeos.Host.Hardware1", "org.legeos.Host.Session1",
    "org.legeos.Host.IndexCheckpoint1",
]
recovery = "every transaction is journalled and resumable: a restart mid-pipeline reads the journal and continues or classifies the failure. Deployment identities persist across restarts."
deadlines = "every mutating method checks polkit before doing anything; long work is journalled and polled rather than held open on the bus"
timer_exceptions = [
    { site = "cmd.rs:64", interval = "50ms", reason = "enforcing the wall-clock timeout on an external command (apt, grub-reboot) so a hung tool cannot wedge a transaction; the wait ends when the child does" },
]


[[component]]
name = "boot-health"
crate = "lege-boot-health"
package = "legeos-boot-health"
unit = "lege-boot-health.service"
scope = "system"
activation = "needs-reboot"
depends_on = []
summary = "boot health probe; only ever runs at boot"
authority = "the boot assessment that promotes or rolls back the booted deployment"
lifetime = "oneshot"
consumer_interfaces = []
recovery = "runs again at the next boot; it holds no state a consumer subscribes to"
deadlines = "every probe is bounded and a hung one is reported as failed rather than waited on"
timer_exceptions = []


[[component]]
name = "session"
crate = "lege-session"
package = "legeos-session"
scope = "none"
activation = "needs-session"
depends_on = []
summary = "session entry and the user units themselves"

[[component]]
name = "comp"
crate = "lege-comp"
package = "legeos-comp"
stamp = "lege-comp"
unit = "lege-comp.service"
scope = "user"
activation = "needs-session"
depends_on = []
summary = "compositor — Restart=no by design, so a new one means a new session"
authority = "surface composition, input routing and z-order (compositor/COMPOSITOR.md); lege-window is the sole visibility authority"
lifetime = "session-bound"
consumer_interfaces = ["lege_shell_v1"]
recovery = "none: Restart=no by design. A crash disconnects every client, so there is nothing to restart into — the compositor-drawn recovery band and a fresh session are the recovery path."
deadlines = "one frame; the render thread takes no lock a service can hold"
timer_exceptions = []


[[component]]
name = "greeter"
crate = "lege-greeter"
package = "legeos-greeter"
scope = "none"
activation = "manual"
depends_on = ["comp"]
summary = "login surface; started by greetd, outside this session"

[[component]]
name = "shell"
crate = "lege-shell"
package = "legeos-shell"
stamp = "lege-shell"
unit = "lege-shell.service"
scope = "user"
activation = "restart"
depends_on = ["sessiond", "filed", "comp"]
summary = "Home Field, panel and the rest of the restartable surface"
authority = "none — it is a view. Home Field layout is persisted through sessiond."
lifetime = "session-bound"
consumer_interfaces = []
recovery = "restartable in about half a second; it re-reads every service it draws from on start"
deadlines = "restart is not allowed to outlive the compositor's recovery band"
timer_exceptions = [
    { site = "surface/app.rs:spawn_reconciliation_loop", interval = "5m", reason = "bounded reconciliation after a lost D-Bus signal or an authority restart, and a backstop for legacy battery, volume, brightness and mount sources that do not yet signal every external change; normal updates use authority signals" },
    { site = "surface/app.rs:copy_text_to_clipboard", interval = "3s deadline", reason = "an inherently temporal upper bound while waiting for wl-copy to take clipboard ownership; the child exit normally wakes the task first" },
    { site = "screenshot.rs:capture", interval = "10s deadline", reason = "an inherently temporal watchdog for a compositor backend that stops producing frame callbacks; a screenshot command must fail rather than hang forever" },
]


[[component]]
name = "settings"
crate = "lege-settings"
package = "legeos-settings"
scope = "none"
activation = "relaunch"
depends_on = ["sessiond"]
summary = "Settings application"

# Built and packaged, but no longer part of the desktop composition: pcmanfm-qt is the file
# manager (docs/architecture/files.md). It stays a component because this matrix is the build
# set — what `cargo xtask build-set` builds and what debian/control ships — not the image
# seeds, which are `distro/seeds/selection.toml` and no longer name it.
[[component]]
name = "files"
crate = "lege-files"
package = "lege-files"
scope = "none"
activation = "relaunch"
depends_on = ["sessiond", "filed"]
summary = "standalone file manager, out of the default composition"

[[component]]
name = "portal"
crate = "xdg-desktop-portal-lege"
package = "legeos-portal"
stamp = "xdg-desktop-portal-lege"
scope = "none"
activation = "manual"
depends_on = ["sessiond", "filed"]
summary = "xdg-desktop-portal backend — D-Bus activated by xdg-desktop-portal, not a unit of ours"

[[component]]
name = "cli"
crate = "lege"
package = "legeos-cli"
scope = "none"
activation = "immediate"
depends_on = []
summary = "lege — the command line, including doctor and this tool"
