# These are deliberate, reviewed non-candidate package writers. Native updates
# and native developer deploy are NOT an exception: they must use hostd.
[[ownership.updater]]
path = "services/templar-hostd/src/apt.rs"
tier = "system"
owner = "hostd"
writes = ["/usr", "/etc", "/var/lib/dpkg", "/var/lib/apt", "/var/cache/apt"]
exceptions = []
[[ownership.updater]]
path = "cli/templar/src/dev/install.rs"
tier = "system"
owner = "cli"
writes = ["/"]
exceptions = [{ path = "/", decision = "@legeos.decision.three-ownership-tiers/2", reason = "Temporary non-TemplarOS developer overlay only; native installation queues a hostd candidate and never reaches live apt" }]
[[ownership.updater]]
path = "installer/provision.sh"
tier = "system"
owner = "installer"
writes = ["/"]
exceptions = [{ path = "/", decision = "@legeos.decision.independent-storage-roles/2", reason = "Reviewed offline target root bootstrap; --apply consumes an identity-checked plan, never running-root package update" }]
[[ownership.updater]]
path = "scripts/build-in-resolute.sh"
tier = "system"
owner = "installer"
writes = ["/"]
exceptions = [{ path = "/", decision = "@legeos.decision.three-ownership-tiers/2", reason = "Disposable development chroot, not the installed operating system" }]
[[ownership.updater]]
path = "scripts/reinstall-templaros-desktop.sh"
tier = "system"
owner = "installer"
writes = ["/"]
exceptions = [{ path = "/", decision = "@legeos.decision.three-ownership-tiers/2", reason = "Temporary Lubuntu overlay validation route; not native TemplarOS deployment" }]
[[ownership.updater]]
path = "scripts/freeze-evidence-setup.sh"
tier = "system"
owner = "installer"
writes = ["/"]
exceptions = [{ path = "/", decision = "@legeos.decision.three-ownership-tiers/2", reason = "Legacy evidence policy setup on the development host; read-only native installs obtain these files in a hostd candidate" }]
[[ownership.updater]]
path = "scripts/update-templaros.sh"
tier = "system"
owner = "cli"
writes = ["/var/lib/templaros/devrepo"]
exceptions = []

