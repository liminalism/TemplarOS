# TemplarOS storage and deployment layout — the single declaration (contract C3, ADR-0004).
#
# Three things consume this file and must agree with it:
#   1. distro/image/mkosi.repart/*.conf — the dev/VM image's partitions and subvolumes.
#      Not generated from here: repart's own syntax is the input mkosi understands, and
#      `layout_declaration_parses_and_matches_repart` (services/templar-hostd/src/boot_entries.rs)
#      fails the build when the two drift apart.
#   2. installer/provision.sh — the narrow target-machine provisioner.
#   3. services/templar-hostd/src/boot_entries.rs — the deployment id grammar, the kernel command
#      line and the ESP directory are compiled in there and pinned to this file by the same test.
#
# Changing anything here is a C3 contract change: it goes through D3, not around it.

version = 1

# --- Partitions (GPT, UEFI only — no legacy BIOS path) ---------------------------------------

[esp]
type = "esp"
format = "vfat"
size_min = "512M"
size_max = "1G"
# Filesystem label. systemd-repart does not set filesystem labels (its `Label=` is the GPT
# partition label), so the mkosi image has none and is found by partition type; the provisioner
# sets this one with `mkfs.vfat -n`. Nothing in the boot path depends on it: generated GRUB
# entries locate the ESP with `search --file`, which works either way.
# Eleven characters, because that is a FAT label's hard limit and mkfs.vfat refuses a longer
# one outright. TEMPLAROS_ESP is thirteen; the rebrand hit that ceiling on 2026-09-09.
label = "TEMPLAR_ESP"
# Where the ESP is mounted on a provisioned target. hostd also accepts `/efi` (a minimal mkosi
# image) — `deploy::esp_root` is the one place that decides.
mount = "/boot/efi"

[root]
type = "root"
format = "btrfs"
size_min = "8G"
# Set by the provisioner (`mkfs.btrfs -L`). This one *is* load-bearing: every generated boot
# entry says `root=LABEL=templaros-root`, because the label is identical for every deployment and
# the deployment id on the command line is what tells them apart.
label = "templaros-root"
mount = "/"
mount_options = "compress=zstd:1"
# @deployments holds writable staging snapshots; an explicit RO installation
# policy seals completed candidates after verification and owned ESP copies.
subvolumes = ["/@", "/@home", "/@var", "/@snapshots", "/@deployments"]

# --- An optional independent data role ---------------------------------------------------------

# A second filesystem that is not the OS and is never assumed expendable
# (@templaros.decision.independent-storage-roles). Absent from every machine provisioned so far; the
# provisioner creates it only when `--data PART` names one, and `--reuse` never formats it.
#
# It is a *role*, not a mount of convenience: it has its own indexing policy (templar-filed registers
# it as a second root with its own RootPolicy, so its freshness and its search visibility are
# independent of @home's), its own preservation policy, and its own identity in
# /etc/templaros/install.toml. Nothing in the boot path depends on it — a machine that loses its data
# disk still boots.
[data]
type = "linux-generic"
format = "btrfs"
label = "templaros-data"
mount = "/data"
mount_options = "compress=zstd:1"
# Reuse what is there. `format` in this field is the explicit, destructive opt-in: the current
# --esp/--root mode's rewriting of type codes and formatting of both partitions is what the
# decision calls "not preservation", and this role does not repeat it.
policy = "reuse"

# There is no separate /boot partition. Kernels and initramfs images live on the ESP inside the
# deployment's own directory, so Ubuntu's initramfs post-update hooks cannot rewrite a
# deployment's boot files. /boot is a directory on @, and /boot/grub holds GRUB's own files.

# --- Deployment identity ----------------------------------------------------------------------

[deployment]
# Mount @deployments directly here; mounted candidates are not boot identities.
mount = "/var/lib/templaros/deployments"
bootstrap_mount = "/var/lib/templaros/roots/bootstrap"
# One path segment, safe as a btrfs subvolume name, a vfat directory name, a GRUB menu entry id
# and a single kernel command-line word.
id_pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
# Rejected explicitly, and why: `/` (path segment), whitespace (the command line is split on it),
# `:` (illegal on vfat), quotes and `$` (GRUB config and shell quoting).
id_forbidden = ["/", ":", " ", "\t", "'", "\"", "$"]
# Who mints ids: the update engine uses its transaction id, the provisioner stamps the first one.
transaction_id_prefix = "txn-"
install_id_prefix = "install-"
# Both stamp with clock::stamp: YYYYMMDDThhmmssZ.
stamp_format = "%Y%m%dT%H%M%SZ"
# The subvolume a deployment's root snapshot lives at, relative to the root subvolume set.
subvolume_template = "@deployments/{id}"
# The ESP directory hostd owns for a deployment: kernel, initramfs and (systemd-boot) its entry.
esp_dir_template = "/EFI/templaros/{id}"

[deployment.cmdline]
# The one thing that distinguishes deployments after the fact. Read by
# `state::booted_deployment_from_cmdline`; written identically by both boot backends.
key = "templaros.deployment="
template = "root=LABEL=templaros-root rootflags=subvol=@ rw templaros.deployment={id}"

# --- Boot managers ------------------------------------------------------------------------------

# Bare metal (Developer Edition 0.1): Canonical-signed shim -> Canonical-signed GRUB ->
# Ubuntu-signed kernel -> Canonical-signed matching NVIDIA LRM. No TemplarOS signing infrastructure
# and no MOK enrolment.
[boot.grub]
# Written whole by hostd on every stage/promote/rollback. Never hand-edited, never produced by
# grub-mkconfig.
entries_file = "/boot/grub/templaros-entries.cfg"
# Shipped as distro/deploy/grub.d/09_templaros, installed by the provisioner. It makes grub.cfg
# source the generated file at boot, so hostd never has to run grub-mkconfig.
stub = "/etc/grub.d/09_templaros"
# The menu entry id is the bare deployment id, which is exactly what hostd passes to
# `grub-reboot` and `grub-set-default`.
menuentry_id_template = "{id}"
# Set by the provisioner in /etc/default/grub. hostd assumes it and never writes that file.
default = "saved"
# hostd keeps the multi-try counter itself: grub-reboot only affects the next boot and nothing
# in GRUB counts attempts.
tries_counter = "hostd"

# Dev/VM images built by mkosi keep systemd-boot with Secure Boot off (ADR-0006, ADR-0004).
[boot.systemd_boot]
entry_template = "/loader/entries/templaros-{id}.conf"
# The loader decrements the `+tries` suffix itself; hostd counts nothing there.
tries_counter = "loader"

# Ownership is checked by xtask, not advertised as runtime sandbox enforcement.
[ownership]
version = 1
external_owners = ["user", "application", "runtime-services", "installer", "network-manager", "bluez", "systemd", "journald", "flatpak", "snapd", "fprintd", "upower", "accounts", "polkit"]

