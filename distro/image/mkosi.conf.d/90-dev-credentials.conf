# DEVELOPER AND VM IMAGES ONLY — never a provisioned machine.
#
# A known root password and an unattended login are exactly what a throwaway VM wants and exactly
# what a real installation must not have. They live in this drop-in, on their own, so that the fact
# is visible: deleting this one file is the whole difference between the dev image and an image
# with no default credentials.
#
# The provisioner (installer/provision.sh) never sets either. It creates the user account with a
# password the person running it supplies or sets interactively, locks root, and leaves the greeter
# asking. `templar doctor --root` reports a provisioned root that carries these settings as a fault.
#
# mkosi images are also Secure Boot off with systemd-boot (ADR-0004/ADR-0006): they are not the
# production boot path, and nothing here is a template for one.
[Content]
RootPassword=templaros
Autologin=yes
