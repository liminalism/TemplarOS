# Baseline packages that must exist before the seed-generated list (50-seeds.conf).
[Content]
Packages=
        systemd
        systemd-boot
        systemd-resolved
        udev
        kmod
        btrfs-progs
        dosfstools
        apt
        ca-certificates
        iproute2
        sudo
        linux-generic
        linux-firmware
        dbus-broker
        polkitd
