# LegeOS dev/VM disk image (ADR-0006). Build: `just image` (mkosi ≥ 25; `ToolsTree=default` makes the
# host's systemd/apt versions irrelevant). Test: `mkosi --directory distro/image vm`.
# Not an installer ISO — see distro/iso/README.md.

[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
Repositories=main,universe,restricted
Mirror=http://archive.ubuntu.com/ubuntu

[Output]
Format=disk
ImageId=legeos
ImageVersion=0.1
OutputDirectory=mkosi.output
CompressOutput=no

[Content]
Bootable=yes
# Dev/VM images: systemd-boot with Secure Boot off. Production posture per ADR-0004.
Bootloader=systemd-boot
# Keep Canonical's kernel signature intact: no self-built UKI in M0.
UnifiedKernelImages=no
KernelCommandLine=rw quiet zswap.enabled=1 zswap.max_pool_percent=20 zswap.compressor=zstd zswap.zpool=zsmalloc
Hostname=legeos
Locale=C.UTF-8
Timezone=UTC
RootPassword=legeos
Autologin=yes
# Package lists are composed from distro/seeds/*.seed by `just image` into mkosi.conf.d/50-seeds.conf.

[Validation]
Checksum=yes

[Build]
ToolsTree=default
Incremental=yes
