# TemplarOS dev/VM disk image (ADR-0006). Build: `just image` (mkosi >=25,
# systemd >=256 and btrfs-progs >=6.12 in ToolsTree for native subvolume copy/default).
# Not an installer ISO — see distro/iso/README.md.

[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
Repositories=main,universe,restricted
Mirror=http://archive.ubuntu.com/ubuntu

[Output]
Format=disk
ImageId=templaros
ImageVersion=0.1
OutputDirectory=mkosi.output
CompressOutput=no

[Content]
Bootable=yes
# Dev/VM images: systemd-boot with Secure Boot off. Production posture per ADR-0004.
Bootloader=systemd-boot
# Keep Canonical's kernel signature intact: no self-built UKI in M0.
UnifiedKernelImages=no
KernelCommandLine=rw rootflags=subvol=@ quiet zswap.enabled=1 zswap.max_pool_percent=20 zswap.compressor=zstd zswap.zpool=zsmalloc
Hostname=templaros
Locale=C.UTF-8
Timezone=UTC
# Dev/VM credentials (root password, autologin) are a drop-in of their own, so an image built for
# anything else does not inherit them: mkosi.conf.d/90-dev-credentials.conf.
# Package lists are generated from distro/seeds/selection.toml by `just image` (compose.sh runs
# `cargo xtask seeds`) into mkosi.conf.d/10-packages-base.conf and 50-seeds.conf.

[Validation]
Checksum=yes

[Build]
ToolsTree=default
Incremental=yes
