# Root on btrfs with subvolumes from day one (ADR-0004): a deployment is a read-only snapshot,
# and kernel + NVIDIA modules + userspace roll back together.
#
# Declared once in distro/deploy/layout.toml; `cargo test -p templar-hostd layout` fails if this
# file and that declaration disagree. @deployments is where the update engine stages candidate
# snapshots (services/templar-hostd/src/updates.rs), so it has to exist from the first image.
[Partition]
Type=root
Format=btrfs
Label=templaros-root
CopyFiles=/:/@
CopyFiles=/home:/@home
CopyFiles=/var/lib/templaros/state:/@var
ExcludeFilesTarget=/@/home /@/var/lib/templaros/state /@/.snapshots /@/var/lib/templaros/deployments /@/boot/efi
MakeDirectories=/@ /@home /@var /@snapshots /@deployments
Subvolumes=/@ /@home /@var /@snapshots /@deployments
DefaultSubvolume=/@
SizeMinBytes=8G
Minimize=guess
