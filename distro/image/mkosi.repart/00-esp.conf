# The ESP. Declared once in distro/deploy/layout.toml; `cargo test -p lege-hostd layout` fails if
# this file and that declaration disagree. Sized for several deployments' kernels and initramfs
# images side by side under /EFI/legeos/<deployment-id>/.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=1G
CopyFiles=/boot:/
CopyFiles=/efi:/
