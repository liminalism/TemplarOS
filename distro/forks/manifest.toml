# Upstream forks pinned here, fetched into ../../forks/ (gitignored) by `just forks-fetch` (ADR-0005).
#
# The compositor is NOT here: `templar-comp` is written against Smithay and is an ordinary member of
# this workspace, not a fork of cosmic-comp (ADR-0012). Nor is the greeter: `templar-greeter` is our
# own, so that logging in does not require a COSMIC toolkit stack.
# Each remaining fork lives in its own repository with an `upstream` tracking branch and a `templaros` patch branch;
# `pin` is the templaros-branch commit the distribution builds. Empty pin = tip of `branch` (dev only).

[xdg-desktop-portal-cosmic]
upstream = "https://github.com/pop-os/xdg-desktop-portal-cosmic"
fork = "https://github.com/templaros/xdg-desktop-portal-cosmic"
branch = "templaros"
pin = ""
purpose = "ScreenCast/Screenshot backends until xdg-desktop-portal-templar covers them"
package = "xdg-desktop-portal-cosmic"


[cosmic-applets]
upstream = "https://github.com/pop-os/cosmic-applets"
fork = "https://github.com/templaros/cosmic-applets"
branch = "templaros"
pin = ""
purpose = "Indicators as views (network/bluetooth/audio) until templar-shell has its own"
package = "cosmic-applets"

[nm-tray-2]
upstream = "https://github.com/palinek/nm-tray"
fork = "https://github.com/LegeApp/nm-tray-alt"
branch = "templaros"
pin = "68cfad0990f304a4433ba76bcffe09dc35bb5122"
purpose = "the network control the Home information row launches; TemplarOS has no system tray to host an applet"
package = "templaros-nm-tray"
note = "ADR-0005 shape restored 2026-10-03: templaros branch carries --popup, the session-bus forwarding slot, X-TemplarOS-* desktop keys, and DHCP-dead-AP auto-steering. Debian's native-network-window.patch adds Wayland-safe menu presentation and bus-local checked forwarding over this pin; package from a clean pinned source."

# Local external source, not a Git fork: the supplied directory has no Git origin.
# The builder closes sibling path dependencies and vendors Cargo.lock inputs into
# a content-addressed archive. A public checkout-only release needs a real origin/pin.
[liminalview]
source_kind = "local"
source = "../liminalview"
purpose = "native image viewer selected by the owner-supplied image defaults"
package = "liminalview"
note = "Local builds use a SHA256-addressed complete source archive; no release upstream/fork/branch/pin has been supplied."
