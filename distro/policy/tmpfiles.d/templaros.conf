# zswap parameters (also on the kernel command line for early boot)
w /sys/module/zswap/parameters/enabled          - - - - Y
w /sys/module/zswap/parameters/max_pool_percent - - - - 20
w /sys/module/zswap/parameters/compressor       - - - - zstd
w /sys/module/zswap/parameters/shrinker_enabled - - - - Y
d /run/templaros            0755 root root -
d /var/lib/templaros        0755 root root -
d /var/lib/templaros/hostd  0700 root root -
d /var/lib/templaros/hostd/transactions 0700 root root -
