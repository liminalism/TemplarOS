# TemplarOS defaults for kitty, the terminal that fills the `terminal` provider role.
#
# Shipped by the `templaros-shell` package to /etc/xdg/kitty/kitty.conf. kitty reads
# $XDG_CONFIG_DIRS before $XDG_CONFIG_HOME, so this is a *default*, not a policy:
# anything in ~/.config/kitty/kitty.conf wins over every line here, and a person who
# has their own kitty configuration never notices this file exists.
#
# The palette is the shell's own (shell/templar-shell/src/surface/design.rs), so a terminal
# on this desktop is the same material as the surfaces around it rather than a black
# rectangle dropped onto a light field. The four semantic colours — red, green, and the
# accent's cyan and blue — are the ones that already mean something in the shell; the
# rest are neutral, because a palette that shouts in eight directions says nothing.

# --- Surface ---------------------------------------------------------------------------
# SHELL and TEXT: the same pair every panel in the shell uses.
background            #fbfcfd
foreground            #171b20
# The user asked for a translucent terminal; the compositor blends it against the field.
background_opacity    0.85
background_blur       0

selection_background  #e3f1f3
selection_foreground  #171b20
cursor                #0e7482
cursor_text_color     #fbfcfd
url_color             #0e7482

# --- Window ----------------------------------------------------------------------------
# The compositor places windows (compositor/COMPOSITOR.md); a terminal that restored its
# own remembered size would be arguing with it on every start.
remember_window_size  no
initial_window_width  92c
initial_window_height 26c
window_padding_width  6
wayland_titlebar_color system
confirm_os_window_close 0

# --- Tabs ------------------------------------------------------------------------------
tab_bar_edge          top
tab_bar_style         powerline
active_tab_background #e3f1f3
active_tab_foreground #171b20
inactive_tab_background #f3f5f7
inactive_tab_foreground #69737d

# --- ANSI palette ----------------------------------------------------------------------
# 0-7 normal, 8-15 bright. Black is the shell's text colour and white its ground, so the
# ordinary case — foreground on background — lands exactly on the surface's own pair.
color0  #171b20
color8  #69737d
# DANGER, and a lighter form of it.
color1  #b3261e
color9  #d2483f
# ACTIVITY.
color2  #1f8f60
color10 #2fae77
# No yellow role exists in the shell's palette; this is the one colour derived rather
# than taken, chosen to sit at the same weight as the two above it.
color3  #8a6d0b
color11 #ab8a1c
# The Temple pair (plan §6): a royal blue for structure, the accent's cyan beside it.
color4  #1d4ed8
color12 #3b6ff0
color5  #8b3a8f
color13 #a755ab
color6  #0e7482
color14 #178f9f
# TEXT_FAINT and the shell's own ground.
color7  #8b939c
color15 #eceef0

# --- Behaviour -------------------------------------------------------------------------
scrollback_lines      10000
enable_audio_bell     no
copy_on_select        no
strip_trailing_spaces smart
