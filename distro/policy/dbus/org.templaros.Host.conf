<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System-bus policy for org.templaros.Host (templar-hostd, ADR-0003). Ownership is root-only; any
     peer may call in. Ordinary privileged mutators check polkit; DisplayRecovery1
     instead checks installed executable identity, exact cgroup/greeter seat and live
     process/name/active-seat lifetime inside hostd. This bus policy grants none of those. -->
<busconfig>
  <policy user="root">
    <allow own="org.templaros.Host"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.templaros.Host"/>
    <allow receive_sender="org.templaros.Host"/>
  </policy>
</busconfig>
