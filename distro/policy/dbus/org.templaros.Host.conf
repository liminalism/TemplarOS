<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System-bus policy for org.templaros.Host (templar-hostd, ADR-0003). Ownership is root-only; any
     peer may call in (every mutating method checks polkit itself — see packaging/polkit/). -->
<busconfig>
  <policy user="root">
    <allow own="org.templaros.Host"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.templaros.Host"/>
    <allow receive_sender="org.templaros.Host"/>
  </policy>
</busconfig>
