# Ordinary applications: accounted, burstable, governed by lege-resourced.
[Slice]
MemoryAccounting=yes
IOAccounting=yes
TasksAccounting=yes
CPUWeight=100
IOWeight=100
# systemd-oomd is the backstop here, not the first responder (ADR-0014). lege-resourced knows
# which window has focus and which application has unsaved work; oomd knows neither. Ninety
# percent sustained pressure on the whole application slice is not resourced doing its job badly
# — it is resourced very likely not running at all, and something has to act before the kernel's
# own OOM killer does.
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=90%
