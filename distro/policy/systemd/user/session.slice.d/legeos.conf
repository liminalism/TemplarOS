# Desktop-session infrastructure (compositor, sessiond, resourced, shell, audio): protected.
[Slice]
MemoryLow=512M
CPUWeight=1000
IOWeight=1000
# systemd-oomd is disarmed here, stated rather than left to a default (ADR-0014). The compositor,
# the shell, sessiond, filed and the governor are what a recovery is *for*; a backstop that can
# kill them is not a backstop. What protects them instead: the MemoryLow above and on each unit,
# OOMScoreAdjust between -500 and -1000, resourced's structural exclusion of everything under
# this slice from the victim pool, and last the kernel OOM killer, which honours OOMScoreAdjust
# and will reach for an application long before it reaches for the compositor.
ManagedOOMMemoryPressure=auto
ManagedOOMSwap=auto
