# The journal is the evidence a frozen desktop leaves (`templar doctor freeze`).
[Journal]
# Persistent whether or not /var/log/journal happened to exist when journald first started: with
# the default `auto`, a missing directory means every log is lost at the next reset.
Storage=persistent
# journald writes to disk every 5 minutes by default (only CRIT and above at once). A hard lockup
# or a held power button then takes the last minutes with it — the minutes that matter.
SyncIntervalSec=15s
