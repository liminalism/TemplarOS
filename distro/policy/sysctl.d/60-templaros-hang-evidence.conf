# A frozen desktop has to leave evidence behind (scripts/freeze-evidence-setup.sh, `templar doctor
# freeze`). The one owner of kernel.sysrq; 60-templaros.conf is VM tuning only.

# SysRq: 4 unraw (R) | 8 debug dumps (W blocked tasks, L all-CPU backtraces, T all tasks) |
# 16 sync (S) | 32 remount read-only (U) | 64 signal processes (E, I) | 128 reboot/poweroff (B).
# Without 8, Alt+SysRq+W/L print nothing, and those are what show where a stuck compositor is
# waiting in the kernel. Ubuntu's default (176) has neither 8 nor 4/64.
kernel.sysrq = 252

# A task stuck in uninterruptible sleep (a GPU fence, a DRM commit) prints its kernel stack after
# two minutes. Ubuntu stops after the first 10 per boot; a long session can spend those early.
kernel.hung_task_timeout_secs = 120
kernel.hung_task_warnings = -1

# A soft lockup is reported with every CPU's backtrace, not just the stuck one's.
kernel.softlockup_all_cpu_backtrace = 1

# A hard lockup leaves no running CPU to log it: panic instead, so efi-pstore keeps the kernel log
# for systemd-pstore to archive into /var/lib/systemd/pstore on the next boot.
kernel.hardlockup_all_cpu_backtrace = 1
kernel.hardlockup_panic = 1

# The default (0) hangs forever after a panic, which looks exactly like a freeze and loses the
# evidence pstore would have kept. Reboot ten seconds after the panic has been recorded.
kernel.panic = 10
