# ---------------------------------------------------------------------------------------------
# Metapackages. `distro/metapackages/<directory>/control.in` is rendered from these stanzas;
# ${misc:Depends} is appended to every Depends automatically.
# ---------------------------------------------------------------------------------------------
[[metapackage]]
package = "legeos-desktop"
directory = "legeos-desktop"
architecture = "all"
layers = ["session", "desktop", "hardware", "graphics", "media", "opt-ime", "opt-a11y", "opt-bluetooth"]
recommends = ["legeos-kernel"]
policy_conflicts = true
description = "LegeOS desktop (metapackage)"
description_body = "Installs the complete LegeOS session and default applications on an Ubuntu 26.04 base."

[[metapackage]]
package = "legeos-session-full"
directory = "legeos-session-meta"
architecture = "all"
layers = ["session"]
description = "LegeOS session only (Stage 1: replacement session on an existing Lubuntu 26.04)"
description_body = "The session and its daemons, without the default applications or the hardware stack."

[[metapackage]]
package = "legeos-kernel"
directory = "legeos-kernel"
architecture = "amd64"
extra_depends = ["linux-generic (>= @KERNEL_MIN@)", "linux-firmware"]
description = "LegeOS kernel set (Ubuntu 26.04 kernel + version-locked NVIDIA modules)"
description_body = """
One tested set: kernel, LRM modules and firmware move together and are updated only through
lege-hostd's transactional path with automatic rollback."""

[[metapackage]]
package = "legeos-nvidia-open"
directory = "legeos-nvidia-open"
architecture = "amd64"
# Not nvidia-driver-*: Ubuntu's driver metapackage Depends on nvidia-dkms-*, the very thing this
# package Conflicts with. The LRM route is the modules package plus the no-dkms userspace set.
extra_depends = [
  "linux-modules-nvidia-@NVIDIA_BRANCH@-open-generic (= @NVIDIA_LRM_VERSION@)",
  "nvidia-headless-no-dkms-@NVIDIA_BRANCH@-open (= @NVIDIA_USERSPACE_VERSION@)",
  "libnvidia-gl-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
  "nvidia-utils-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
  "xserver-xorg-video-nvidia-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
]
# Not `Conflicts: nvidia-dkms-*`: Ubuntu's LRM modules package *Provides* nvidia-dkms-<branch>, so
# that conflict forbade the very package it was meant to protect. `dkms` itself is what ADR-0004
# excludes - no locally built module, no MOK - and nothing in the closure needs it.
conflicts = ["legeos-nvidia-proprietary", "dkms"]
description = "NVIDIA open kernel modules + userspace (Turing and newer), one driver authority"
description_body = "The open-module flavour, version-locked to the kernel legeos-kernel selects."

[[metapackage]]
package = "legeos-nvidia-proprietary"
directory = "legeos-nvidia-proprietary"
architecture = "amd64"
extra_depends = [
  "linux-modules-nvidia-@NVIDIA_BRANCH@-generic (= @NVIDIA_LRM_VERSION@)",
  "nvidia-headless-no-dkms-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
  "libnvidia-gl-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
  "nvidia-utils-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
  "xserver-xorg-video-nvidia-@NVIDIA_BRANCH@ (= @NVIDIA_USERSPACE_VERSION@)",
]
conflicts = ["legeos-nvidia-open", "dkms"]
description = "NVIDIA proprietary kernel modules + userspace (pre-Turing), one driver authority"
description_body = "The proprietary flavour, version-locked to the kernel legeos-kernel selects."

[[metapackage]]
package = "legeos-archive-keyring"
directory = "legeos-archive-keyring"
architecture = "all"
description = "LegeOS archive pinning"
description_body = """
Installs /etc/apt/preferences.d/legeos-nvidia (third-party driver repositories pinned to -1) and
legeos-priority. The archive key and the source stanza are written by the provisioner from the
archive it installs from; until archive.legeos.org exists there is no public key to ship."""

[[metapackage]]
package = "legeos-dev-rust"
directory = "legeos-dev-rust"
architecture = "all"
layers = ["dev-rust"]
description = "LegeOS Rust development set (metapackage)"
description_body = """
Everything needed to build this workspace and its Debian packages on the machine it runs on.
Ubuntu's rustc may lag the workspace MSRV; rustup remains the developer's route."""

[[metapackage]]
package = "legeos-dev-cuda"
directory = "legeos-dev-cuda"
architecture = "amd64"
layers = ["dev-cuda"]
recommends = ["legeos-nvidia-open"]
description = "LegeOS CUDA development set (metapackage)"
description_body = """
The CUDA toolchain, kept apart from legeos-dev-rust so a machine can have one without the other.
Requires an NVIDIA driver flavour to be selected; the package list is provisional until the
hardware lane pins it to a driver branch."""
