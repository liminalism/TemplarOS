[[layer.package]]
name = "iproute2"
reason = "the minimum network diagnosis a recovery shell needs"

[[layer.package]]
name = "iputils-ping"
reason = "the minimum network diagnosis a recovery shell needs"

[[layer.package]]
name = "sudo"
