[[layer.package]]
name = "apt-utils"
reason = "apt-ftparchive builds the local build-set archive (D2)"

[[layer.package]]
name = "ca-certificates"
reason = "HTTPS to the archive and to snapshot.ubuntu.com"

[[layer.package]]
name = "gnupg"
