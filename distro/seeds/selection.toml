# The one package-selection declaration. Everything downstream is generated from this file:
#
#   distro/seeds/<layer>.seed                       (flat lists, for readers that want names only)
#   distro/image/mkosi.conf.d/10-packages-base.conf (the `base` stage)
#   distro/image/mkosi.conf.d/50-seeds.conf         (the `seeds` stage, gitignored)
#   distro/metapackages/*/control.in                (the metapackage dependency lists)
#
# Render with `cargo xtask seeds`; `cargo xtask seeds --check` (and `cargo xtask check-packaging`)
# fail if any generated file has drifted from this one. Never edit a generated file by hand.
#
# Every direct package carries a `reason`. That is the point of the file: a name with no reason is
# a name nobody can remove later, because nobody knows what it was for.
#
# Contract: .agent/scratch/de01/C1-contract.md (C1). Consumers (D2 archive, D3 provisioning,
# D4 hardware, X1 daily driver) request packages by message; they do not edit this file.
#
# RESOLVED NAMES: first resolved against Ubuntu 26.04 "resolute" on 2026-09-05 (the snapshot pin is
# in distro/base.toml). `cargo xtask seeds closure` says which of the three states a host is in
# (resolved / foreign-release / unavailable) and never presents an unresolved list as a closure.
# Without root, point apt at a private index: APT_CONFIG=<dir>/apt.conf with Dir::State/Dir::Cache
# under <dir> and a resolute sources.list, `apt-get update`, then run the closure with the same env.
# The NVIDIA branch number is a template (@NVIDIA_BRANCH@); resolute's LRM is 580 (open and proprietary).

version = 1

# The archive identity — series, codename, components, mirror and the snapshot pin — is declared
# once in distro/base.toml and read from there. It is deliberately not repeated here.

[policy]
# Never selected anywhere, and rendered as `Conflicts:` on the metapackages that opt in.
# ADR-0011: Flatpak is the sandboxed application route; Snap is absent from the seeds, and the
# crash handlers Ubuntu ships are not ours to run.
conflicts = ["snapd", "apport", "whoopsie", "ubuntu-report"]
# The image's recommends posture. The deployment path is already --no-install-recommends
# (cli/lege/src/dev/install.rs:41-49); the image is not, and turning it off is a decision, not a
# generation detail. `cargo xtask seeds closure` reports what "off" would cost before anyone takes it.
recommends = "on"

