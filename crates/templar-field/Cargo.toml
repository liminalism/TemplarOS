[package]
name = "templar-field"
description = "The Home Field model: tiles on a bounded, stable grid; operations with exact inverses; local reflow; the drag/throw state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately no tokio / zbus / pixelkit: this is pure data and geometry, shared by the shell
# (which renders it) and sessiond (which persists it), and property-tested like `templar-window`.
[dependencies]
templar-types = { workspace = true }
serde = { workspace = true }
# For `migrate`: a document written by an older build has a shape `FieldDocument` cannot
# represent, so a migration step has to work on the parsed JSON rather than on the struct.
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
