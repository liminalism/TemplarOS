[package]
name = "templar-wallpaper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
decode = ["dep:png", "dep:jpeg-decoder", "dep:image-webp", "dep:zune-jpeg", "dep:zune-core"]
compatibility = ["dep:x11rb", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:zbus", "dep:tokio", "dep:futures-util", "dep:clap"]

[dependencies]
templar-types.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
png = { workspace = true, optional = true }
jpeg-decoder = { version = "0.3.2", default-features = false, optional = true }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"], optional = true }
zune-core = { version = "0.5.3", default-features = false, features = ["std"], optional = true }
image-webp = { version = "0.2.4", optional = true }
x11rb = { version = "0.13", features = ["shm", "randr"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
zbus = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[[bin]]
name = "templar-wallpaper-decode"
path = "src/bin/decode.rs"
required-features = ["decode"]

[[bin]]
name = "templar-wallpaper"
path = "src/bin/compat.rs"
required-features = ["compatibility"]

[lints]
workspace = true
