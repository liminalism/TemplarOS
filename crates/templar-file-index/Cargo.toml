[package]
name = "templar-file-index"
description = "TemplarOS shared file index: generations, lossless paths, budgeted scans, FTS5 search, cursors and sealed snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["store"]
# Consumers decode the same models and snapshot format without linking SQLite or watchers.
store = ["dep:anyhow", "dep:inotify", "dep:parking_lot", "dep:rusqlite", "dep:tracing", "dep:uuid"]

[dependencies]
anyhow = { workspace = true, optional = true }
inotify = { version = "0.11", default-features = false, optional = true }
parking_lot = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
