[package]
name = "lege-field"
description = "The Home Field model: tiles on a bounded, stable grid; operations with exact inverses; local reflow; the drag/throw state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately no tokio / zbus / pixelkit: this is pure data and geometry, shared by the shell
