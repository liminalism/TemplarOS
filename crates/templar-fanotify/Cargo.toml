[package]
name = "templar-fanotify"
description = "fanotify bindings and a FanotifySource for the TemplarOS file index: the measured alternative to per-directory inotify watches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# `libc` for the four syscalls glibc exposes and the kernel's FAN_* constants; `templar-file-index`
# for the `EventSource` seam this crate plugs into. Nothing else: the whole point of writing the
# binding here rather than taking a dependency is that no fanotify crate in the registry parses
# the `FAN_REPORT_DFID_NAME` info records, which is the only mode this index can use.
[dependencies]
templar-file-index = { workspace = true, features = ["store"] }
libc = { workspace = true }

# Examples only. `fanotify-lab`'s overflow workload has to drive a raw inotify fd with no reader
# thread, which `InotifySource` deliberately does not expose.
[dev-dependencies]
inotify = { version = "0.11", default-features = false }
tempfile = { workspace = true }

[lints]
workspace = true
